name: Mod Build

on:
  workflow_call:
    inputs:
      solution:
        description: 'Solution or project to build. Empty lets dotnet discover it.'
        type: string
        required: false
        default: ''
      dotnet-version:
        description: 'SDK version passed to actions/setup-dotnet.'
        type: string
        required: false
        default: '10.x'
      validate-xml:
        description: 'Run xmllint over assets/**/*.xml.'
        type: boolean
        required: false
        default: true
      compile:
        description: >-
          Build the solution. Set false only for a mod that cannot compile standalone
          on a runner, e.g. one with a cross-repository ProjectReference. Such a repo
          gets XML validation but no compile check, which is a gap worth closing.
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        if: ${{ inputs.compile }}
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        if: ${{ inputs.compile }}
        run: dotnet build ${{ inputs.solution }} --configuration Release --no-restore

      - name: Validate XML files
        if: ${{ inputs.validate-xml }}
        uses: phpcsstandards/xmllint-validate@v2
        with:
          pattern: "assets/**/*.xml"

      - name: Upload mod package
        if: ${{ inputs.compile }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
